# Modest heap is plenty for a single-module app. UTF-8 keeps the non-ASCII game
# folder path in MainActivity.kt readable to the Kotlin compiler regardless of
# the host platform encoding.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Required by androidx.core (FileProvider). Jetifier is deliberately NOT enabled:
# nothing here uses a legacy support-library artifact, so `enableJetifier=true`
# would only add build time.
android.useAndroidX=true
